[package]
name = "swash"
version = "0.1.0"
edition = "2024"

[dependencies]
quick-xml = { version = "0.38.4", features = ["serialize", "async-tokio"] }
reqwest = { version = "0.12.28", features = ["stream"] }
serde = "1.0.228"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio"] }
caramel = { path = "./caramel", features = ["ns", "log"] }
tokio = { version = "1.48.0", features = ["full"] }
futures = "0.3.31"
async-compression = { version = "0.4.36", features = ["tokio", "gzip"] }
tokio-util = "0.7.17"
html-escape = "0.2.13"
dotenv = "0.15.0"
serde_json = "1.0.148"
clap = "4.5.53"
log = { version = "0.4.29", features = ["max_level_debug", "release_max_level_info"] }
regex = "1.13.1"
